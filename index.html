  .dash-tag-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }

  .chip.daycare { background: linear-gradient(150deg,#9FE3F5,#5FC3E0); color:#0B4A5C; box-shadow:2px 2px 5px rgba(20,140,170,.25), -2px -2px 5px rgba(255,255,255,.7); }

    box-shadow: 3px 3px 7px rgba(148,163,184,.3), -3px -3px 7px rgba(255,255,255,.9); }

  @media (min-width:640px) { .bed-grid { grid-template-columns:repeat(3,1fr); } }
  .bed-tile { border-radius:20px; padding:12px 10px; display:flex; flex-direction:column; align-items:center; gap:8px;

  .bed-tile.on { background: linear-gradient(155deg,#EAFBF1,#CFF3DE);
    box-shadow: 5px 5px 12px rgba(52,211,153,.25), -4px -4px 10px rgba(255,255,255,.9),

  .bed-tile.off { background: linear-gradient(155deg,#FFF0F1,#FDD9DD);
    box-shadow: 5px 5px 12px rgba(244,63,94,.2), -4px -4px 10px rgba(255,255,255,.9),
      inset 1px 1px 2px rgba(255,255,255,.7), inset -2px -2px 6px rgba(190,30,60,.12); }

  .tag-row { display:grid; grid-template-columns:1fr 1fr; gap:6px; width:100%; margin-top:2px; }
  .tag-btn { font-size:10.5px; line-height:1.25; padding:8px 6px; border-radius:12px; border:none; min-height:36px;
    background: linear-gradient(150deg,#ffffff,#F0F2F7); color:#78829C; font-weight:600; cursor:pointer;
    box-shadow: 2px 2px 5px rgba(148,163,184,.25), -2px -2px 5px rgba(255,255,255,.8); }
  .tag-btn.active { background: linear-gradient(150deg,#CBB2F0,#9B6FE0); color:white;

  .bed-label-row { display:flex; align-items:center; gap:5px; color:#44403c; }

  .toggle3d { width:54px; height:31px; border-radius:999px; position:relative; border:none; cursor:pointer; flex-shrink:0; }
  .toggle3d.on { background: linear-gradient(150deg,#7FE0AC,#3CB878);

  .bed-status { font-size:11.5px; font-weight:700; }

  .btn-danger { background: linear-gradient(150deg,#FF9AA6,#E11D48); color:#ffffff; font-weight:700;

  .drawer-note { font-size:11px; color:#78716c; }
  .close-btn { background:none; border:none; color:#94A3B8; cursor:pointer; }

  .add-zone-card { border-radius:28px; padding:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;

  .add-zone-card:active { background: rgba(148,163,184,.08); }
  .month-input { border:none; border-radius:10px; padding:6px 10px; font-size:12px; background:#F4F6FA; box-shadow: inset 2px 2px 4px rgba(148,163,184,.25); }
  .staytype-select { width:100%; font-size:11.5px; text-align:center; background: linear-gradient(150deg,#ffffff,#F3F5F9); border:none;
    border-radius:12px; padding:8px; min-height:34px; color:#475569; box-shadow: inset 2px 2px 5px rgba(148,163,184,.25); }
  .stay-chip { font-size:9.5px; font-weight:700; padding:3px 8px; border-radius:999px; }
  .stay-chip.overnight { background: linear-gradient(150deg,#DCEAFE,#B9D6FC); color:#1D4E8F; }
  .stay-chip.daytrip { background: linear-gradient(150deg,#FDE9CE,#FBCE8F); color:#8A4E0B; }
  .num-input { width:64px; }

  .appfoot { padding:6px 16px; text-align:center; font-size:10px; color:#64748B; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

function zoneCounts(zone) {
  const total = zone.beds.length;
  const available = zone.beds.filter((b) => b.available).length;
  return { total, available };
}
function buildingCounts(b) { return b.zones.reduce((a,z)=>{const c=zoneCounts(z);return {total:a.total+c.total, available:a.available+c.available};},{total:0,available:0}); }
function overallCounts(bs) { return bs.reduce((a,b)=>{const c=buildingCounts(b);return {total:a.total+c.total, available:a.available+c.available};},{total:0,available:0}); }

function formatUpdated(iso) {
  if (!iso) return "ยังไม่มีการอัปเดต";
  const d = new Date(iso);
  const diffMin = Math.floor((Date.now() - d.getTime()) / 60000);
  if (diffMin < 1) return "เพิ่งอัปเดต";
  if (diffMin < 60) return `${diffMin} นาทีที่แล้ว`;
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return `${diffHr} ชม. ที่แล้ว`;
  return d.toLocaleString("th-TH", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
}
function formatUpdatedFull(iso) {
  if (!iso) return "ยังไม่มีการอัปเดตข้อมูล";
  return new Date(iso).toLocaleString("th-TH", { day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" }) + " น.";
}

function tagBreakdown(buildings) {
  const acc = { common: { total: 0, available: 0 }, vip: { total: 0, available: 0 }, daycare: { total: 0, available: 0 } };
  buildings.forEach((b) => b.zones.forEach((z) => {
    const c = zoneCounts(z);
    const bucket = acc[z.tag] || acc.common;
    bucket.total += c.total; bucket.available += c.available;
  }));
  return acc;
}

function daysInMonthStr(month) {
  const [y, m] = month.split("-").map(Number);
  return new Date(y, m, 0).getDate();
}

// น้ำหนักวันเข้าพัก: ค้างคืน = 1 วัน/คืน, เช้าเย็นกลับ = 0.5 วัน (ตามที่ตกลงไว้)
function computeMonthlySummary(logs, buildings, month) {
  const dim = daysInMonthStr(month);
  const [y, m] = month.split("-").map(Number);
  const monthStart = new Date(y, m - 1, 1);
  const monthEnd = new Date(y, m, 1); // exclusive

  const bedDaysByBuilding = {};
  const totalBedsByBuilding = {};
  buildings.forEach((b) => { totalBedsByBuilding[b.id] = buildingCounts(b).total; bedDaysByBuilding[b.id] = 0; });

  (logs || []).forEach((log) => {
    const inD = new Date(log.checkInAt);
    if (log.stayType === "daytrip") {
      const d = new Date(inD.getFullYear(), inD.getMonth(), inD.getDate());
      if (d >= monthStart && d < monthEnd) bedDaysByBuilding[log.buildingId] = (bedDaysByBuilding[log.buildingId] || 0) + 0.5;
    } else {
      const outD = log.checkOutAt ? new Date(log.checkOutAt) : new Date();
      let cur = new Date(inD.getFullYear(), inD.getMonth(), inD.getDate());
      const endDate = new Date(outD.getFullYear(), outD.getMonth(), outD.getDate());
      const cutoff = log.checkOutAt ? endDate : new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate() + 1);
      while (cur < cutoff) {
        if (cur >= monthStart && cur < monthEnd) bedDaysByBuilding[log.buildingId] = (bedDaysByBuilding[log.buildingId] || 0) + 1;
        cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 1);
      }
    }
  });

  const byBuilding = buildings.map((b) => {
    const totalBeds = totalBedsByBuilding[b.id] || 0;
    const possible = totalBeds * dim;
    const occupied = bedDaysByBuilding[b.id] || 0;
    const rate = possible ? Math.round((occupied / possible) * 1000) / 10 : 0;
    return { buildingId: b.id, buildingName: b.name, rate, occupied, possible };
  });
  const totalPossible = byBuilding.reduce((a, x) => a + x.possible, 0);
  const totalOccupied = byBuilding.reduce((a, x) => a + x.occupied, 0);
  const overallRate = totalPossible ? Math.round((totalOccupied / totalPossible) * 1000) / 10 : 0;
  return { byBuilding, overallRate };
}

function exportMonthlyExcel(logs, month) {
  const stayRows = (logs || []).map((l) => ({
    "อาคาร": l.buildingName, "โซน": l.zoneName, "เตียง": l.bedLabel,
    "ชื่อคนไข้": l.patient || "", "ประเภท": l.stayType === "daytrip" ? "เช้าเย็นกลับ" : "ค้างคืน",
    "วันที่เข้า": l.checkInAt ? new Date(l.checkInAt).toLocaleString("th-TH") : "",
    "วันที่ออก": l.checkOutAt ? new Date(l.checkOutAt).toLocaleString("th-TH") : "ยังอยู่",
    "แท็กเคส": (l.caseTags || []).join(", "),
  }));

  const [y, m] = month.split("-").map(Number);
  const monthStart = new Date(y, m - 1, 1);
  const monthEnd = new Date(y, m, 1);
  const dailyRows = [];
  (logs || []).forEach((l) => {
    const inD = new Date(l.checkInAt);
    if (l.stayType === "daytrip") {
      const d = new Date(inD.getFullYear(), inD.getMonth(), inD.getDate());
      if (d >= monthStart && d < monthEnd) {
        dailyRows.push({ "วันที่": d.toLocaleDateString("th-TH"), "อาคาร": l.buildingName, "โซน": l.zoneName, "เตียง": l.bedLabel, "ชื่อคนไข้": l.patient || "", "ประเภท": "เช้าเย็นกลับ" });
      }
    } else {
      const outD = l.checkOutAt ? new Date(l.checkOutAt) : new Date();
      let cur = new Date(inD.getFullYear(), inD.getMonth(), inD.getDate());
      const endDate = new Date(outD.getFullYear(), outD.getMonth(), outD.getDate());
      const cutoff = l.checkOutAt ? endDate : new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate() + 1);
      while (cur < cutoff) {
        if (cur >= monthStart && cur < monthEnd) {
          dailyRows.push({ "วันที่": cur.toLocaleDateString("th-TH"), "อาคาร": l.buildingName, "โซน": l.zoneName, "เตียง": l.bedLabel, "ชื่อคนไข้": l.patient || "", "ประเภท": "ค้างคืน" });
        }
        cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 1);
      }
    }
  });
  dailyRows.sort((a, b) => (a["วันที่"] > b["วันที่"] ? 1 : a["วันที่"] < b["วันที่"] ? -1 : 0));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(stayRows), "สรุปการเข้าพัก");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dailyRows), "สรุปรายวัน");
  XLSX.writeFile(wb, `สรุปเตียง-${month}.xlsx`);
}

              <div className="zone-name" style={{marginTop:4}}>{b.name}</div>
              <div className={`zone-count ${c.available>0?"has":"none"}`}>ว่าง {c.available}/{c.total} เตียง</div>
              <div className="dash-occ-bar small"><div className="dash-occ-fill" style={{ width: `${c.total ? Math.round(((c.total-c.available)/c.total)*100) : 0}%` }} /></div>
              <div className="branch-updated" style={{marginTop:6, opacity:.7}}><Icon.Clock size={9} /> {formatUpdated(b.updatedAt)}</div>
            </button>
          );
        })}
      </div>

      <div className="dash-chart-card">
        <div className="dash-chart-title" style={{display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8}}>
          <span>Occupancy Rate รายเดือน (สำหรับผู้บริหาร/บัญชี)</span>
          <input type="month" value={month} onChange={(e)=>setMonth(e.target.value)} className="month-input" />
        </div>
        {logLoading ? (
          <div style={{fontSize:12, color:"#94A3B8"}}>กำลังคำนวณ...</div>
        ) : logError ? (
          <div style={{fontSize:12, color:"#DC2626"}}>โหลดข้อมูลย้อนหลังไม่สำเร็จ — ตรวจสอบการเชื่อมต่อ</div>
        ) : summary ? (
          <>
            <div className="dash-occ-bar"><div className="dash-occ-fill" style={{ width: `${summary.overallRate}%` }} /></div>
            <div className="dash-occ-label">Occupancy Rate เดือนนี้ (รวมทุกสาขา): {summary.overallRate}%</div>
            {summary.byBuilding.map((bs) => (
              <div key={bs.buildingId} className="dash-bar-row" style={{cursor:"default"}}>
                <span className="dash-bar-label">{bs.buildingName}</span>
                <span className="dash-bar-track" style={{ width:"100%" }}>
                  <span className="dash-bar-fill" style={{ width: `${bs.rate}%` }} />
                </span>
                <span className="dash-bar-count">{bs.rate}%</span>
              </div>
            ))}
            <button className="btn-emerald" style={{marginTop:6}} onClick={()=>exportMonthlyExcel(logs, month)}>
              <Icon.Chart size={14} /> ดาวน์โหลด Excel สำหรับวางบิล
            </button>
            <p className="drawer-note" style={{margin:0}}>เช้าเย็นกลับนับเป็น 0.5 วันในสูตร Occupancy Rate ส่วนไฟล์ Excel มี 2 ชีท: สรุปการเข้าพัก และสรุปรายวัน</p>
          </>
        ) : null}
      </div>
    </div>
  );
}

function App() {
  const [buildings, setBuildings] = useState(null);
  const [activeId, setActiveId] = useState("__dashboard__");
  const [editZone, setEditZone] = useState(null);
  const [saving, setSaving] = useState(false);
  const [lastSync, setLastSync] = useState(null);
  const [connError, setConnError] = useState(false);
  const [expandedBeds, setExpandedBeds] = useState(() => new Set());
  const [confirmDelete, setConfirmDelete] = useState(null); // {buildingId, zoneId, bed}
  const [pendingCheckIn, setPendingCheckIn] = useState(null); // {buildingId, zoneId, bedId, bedLabel}
  const [addZoneFor, setAddZoneFor] = useState(null); // buildingId
  const [confirmDeleteZone, setConfirmDeleteZone] = useState(null); // {buildingId, zoneId, zoneName, bedCount, hasOccupied}
  const buildingsRef = useRef(null);
  const skipPollUntil = useRef(0);
  const writeTimer = useRef(null);
  const connected = true;

  useEffect(() => { buildingsRef.current = buildings; }, [buildings]);
  useEffect(() => { const t = setInterval(()=>setBuildings((b)=>b?[...b]:b), 30000); return ()=>clearInterval(t); }, []);

  async function fetchData() {
    const res = await fetch(`${API_URL}?key=${encodeURIComponent(API_KEY)}`);
    if (!res.ok) throw new Error("fetch failed");
    const data = await res.json();
    if (data && data.ok === false) throw new Error(data.error || "request failed");
    return data;
  }
  async function postAction(payload) {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids Apps Script CORS preflight issue
      body: JSON.stringify({ key: API_KEY, ...payload }),
    });
    const data = await res.json().catch(() => null);
    if (!data || data.ok === false) throw new Error((data && data.error) || "request failed");
    return data;
  }

  useEffect(() => {
    if (!connected) { if (!buildingsRef.current) setBuildings(seedData()); return; }
    let cancelled = false;
    async function load(initial) {
      // เว้นรอบโพลนี้ไปก่อน ถ้าเพิ่งมีการกดแก้ไขสดไม่นานมานี้ — กันข้อมูลที่ชีทยังเขียนไม่ทันมาทับของที่เพิ่งกด
      if (!initial && Date.now() < skipPollUntil.current) return;
      try {
        const data = await fetchData();
        if (cancelled) return;
        if (Array.isArray(data) && data.length > 0) {
          setBuildings((prev) => {
            if (prev) {
              const prevStr = JSON.stringify(prev.map(({ updatedAt, ...rest }) => rest));
              const nextStr = JSON.stringify(data.map(({ updatedAt, ...rest }) => rest));
              if (prevStr === nextStr) return prev; // ข้อมูลเหมือนเดิมทุกอย่าง ไม่ต้อง re-render ทับให้จอกระพริบ
            }
            return data;
          });
        }
        else if (initial) { const seed = seedData(); setBuildings(seed); postAction({ action: "replaceAll", buildings: seed }).catch(console.error); }
        setLastSync(new Date()); setConnError(false);
      } catch (e) {
        console.error(e); setConnError(true);
        if (initial && !buildingsRef.current) setBuildings(seedData());
      }
    }
    load(true);
    const t = setInterval(() => load(false), POLL_MS);
    return () => { cancelled = true; clearInterval(t); };
  }, []);

  async function sendAction(payload) {
    if (!connected) return;
    skipPollUntil.current = Date.now() + 6000;
    setSaving(true);
    try { await postAction(payload); setLastSync(new Date()); setConnError(false); }
    catch (e) { console.error(e); setConnError(true); }
    setSaving(false);
  }
  async function manualRefresh() {
    if (!connected) return;
    try { const data = await fetchData(); if (Array.isArray(data) && data.length > 0) setBuildings(data); setLastSync(new Date()); setConnError(false); }
    catch (e) { setConnError(true); }
  }

  function mapBed(buildingId, zoneId, bedId, fn) {
    return buildings.map((b) => b.id!==buildingId ? b : {
      ...b, updatedAt: new Date().toISOString(),
      zones: b.zones.map((z) => z.id!==zoneId ? z : { ...z, beds: z.beds.map((bed)=> bed.id!==bedId ? bed : fn(bed)) }),
    });
  }
  function toggleBed(buildingId, zoneId, bedId) {
    const b = buildings.find((x) => x.id === buildingId);
    const z = b && b.zones.find((x) => x.id === zoneId);
    const bed = z && z.beds.find((x) => x.id === bedId);
    if (!bed) return;
    if (bed.available) {
      // กำลังจะเปิดเตียงเป็น "ไม่ว่าง" — บังคับเลือกประเภทการเข้าพักก่อนทุกครั้ง
      setPendingCheckIn({ buildingId, zoneId, bedId, bedLabel: bed.label });
      return;
    }
    // กำลังจะปิดเป็น "ว่าง" (checkout) — ทำทันที ไม่ต้องเลือกอะไร
    doSetBedState(buildingId, zoneId, bedId, { available: true, patient: "", stayType: "" });
  }
  function confirmCheckIn(stayType) {
    if (!pendingCheckIn) return;
    const { buildingId, zoneId, bedId } = pendingCheckIn;
    doSetBedState(buildingId, zoneId, bedId, { available: false, stayType });
    setPendingCheckIn(null);
  }
  function doSetBedState(buildingId, zoneId, bedId, patch) {
    const next = mapBed(buildingId, zoneId, bedId, (bed) => ({ ...bed, ...patch }));
    setBuildings(next);
    setExpandedBeds((prev) => {
      const s = new Set(prev);
      if (patch.available) s.delete(bedId); else s.add(bedId); // auto-open details right after marking occupied
      return s;
    });
    sendAction({ action: "updateBed", zoneId, bedId, patch });
  }
  function changeStayType(buildingId, zoneId, bedId, value) {
    setBuildings(mapBed(buildingId, zoneId, bedId, (bed) => ({ ...bed, stayType: value })));
    sendAction({ action: "updateBed", zoneId, bedId, patch: { stayType: value } });
  }
  function toggleExpand(bedId) {
    setExpandedBeds((prev) => {
      const s = new Set(prev);
      if (s.has(bedId)) s.delete(bedId); else s.add(bedId);
      return s;
    });
  }
  function changeBedName(buildingId, zoneId, bedId, value) {
    setBuildings(mapBed(buildingId, zoneId, bedId, (bed)=>({ ...bed, patient: value })));
    if (!connected) return;
    if (writeTimer.current) clearTimeout(writeTimer.current);
    writeTimer.current = setTimeout(() => sendAction({ action: "updateBed", zoneId, bedId, patch: { patient: value } }), 700);
  }
  function flushWriteName(buildingId, zoneId, bedId) {
    if (writeTimer.current) { clearTimeout(writeTimer.current); writeTimer.current = null; }
    const b = (buildingsRef.current || []).find((bb) => bb.id === buildingId);
    const z = b && b.zones.find((zz) => zz.id === zoneId);
    const bed = z && z.beds.find((bb) => bb.id === bedId);
    if (bed) sendAction({ action: "updateBed", zoneId, bedId, patch: { patient: bed.patient } });
  }
  function toggleCaseTag(buildingId, zoneId, bedId, tagId) {
    let newTags = null;
    const next = mapBed(buildingId, zoneId, bedId, (bed) => {
      const tags = bed.caseTags || [];
      const has = tags.includes(tagId);
      newTags = has ? tags.filter((t)=>t!==tagId) : [...tags, tagId];
      return { ...bed, caseTags: newTags };
    });
    setBuildings(next);
    sendAction({ action: "updateBed", zoneId, bedId, patch: { caseTags: newTags } });
  }
  function addBed(buildingId, zoneId) {
    const building = buildings.find((b) => b.id === buildingId);
    const zone = building && building.zones.find((z) => z.id === zoneId);
    if (!zone) return;
    const n = zone.beds.length + 1;
    const prefix = zone.beds[0] ? zone.beds[0].label.replace(/\d+$/, "") : "A";
    const bed = { id: `${zoneId}-${Date.now()}`, label: `${prefix}${n}`, available: true, patient: "", caseTags: [] };
    const next = buildings.map((b) => b.id!==buildingId ? b : {
      ...b, updatedAt: new Date().toISOString(),
      zones: b.zones.map((z) => z.id!==zoneId ? z : { ...z, beds: [...z.beds, bed] }),
    });
    setBuildings(next);
    sendAction({ action: "addBed", buildingId, buildingName: building.name, buildingSub: building.sub, zoneId, zoneName: zone.name, zoneTag: zone.tag, bed });
  }
  function requestRemoveBed(buildingId, zoneId) {
    const building = buildings.find((b) => b.id === buildingId);
    const zone = building && building.zones.find((z) => z.id === zoneId);
    if (!zone || zone.beds.length <= 1) return;
    const bed = zone.beds[zone.beds.length - 1];
    setConfirmDelete({ buildingId, zoneId, bed });
  }
  function confirmRemoveBed() {
    if (!confirmDelete) return;
    const { buildingId, zoneId, bed } = confirmDelete;
    const next = buildings.map((b) => b.id!==buildingId ? b : {
      ...b, updatedAt: new Date().toISOString(),
      zones: b.zones.map((z) => z.id!==zoneId ? z : { ...z, beds: z.beds.slice(0, -1) }),
    });
    setBuildings(next);
    sendAction({ action: "removeBed", zoneId, bedId: bed.id });
    setConfirmDelete(null);
  }
  function renameZone(buildingId, zoneId, patch) {
    const next = buildings.map((b) => b.id!==buildingId ? b : { ...b, updatedAt: new Date().toISOString(), zones: b.zones.map((z)=> z.id!==zoneId ? z : { ...z, ...patch }) });
    setBuildings(next);
    sendAction({ action: "renameZone", zoneId, patch });
  }
  function createZone(buildingId, form) {
    const building = buildings.find((b) => b.id === buildingId);
    if (!building) return;
    const zoneId = `${buildingId}-z${Date.now()}`;
    const beds = Array.from({ length: Math.max(1, form.bedCount || 1) }, (_, i) => ({
      id: `${zoneId}-${i + 1}`, label: `${form.prefix}${i + 1}`, available: true, patient: "", stayType: "", caseTags: [],
    }));
    const zone = { id: zoneId, name: form.name, tag: form.tag, beds };
    const next = buildings.map((b) => b.id!==buildingId ? b : { ...b, updatedAt: new Date().toISOString(), zones: [...b.zones, zone] });
    setBuildings(next);
    sendAction({ action: "addZone", buildingId, buildingName: building.name, buildingSub: building.sub, zone });
    setAddZoneFor(null);
  }
  function requestRemoveZone(buildingId, zoneId) {
    const building = buildings.find((b) => b.id === buildingId);
    const zone = building && building.zones.find((z) => z.id === zoneId);
    if (!zone) return;
    if (building.zones.length <= 1) { alert("ต้องมีอย่างน้อย 1 โซนต่ออาคาร ลบไม่ได้ครับ"); return; }
    const hasOccupied = zone.beds.some((b) => !b.available);
    setConfirmDeleteZone({ buildingId, zoneId, zoneName: zone.name, bedCount: zone.beds.length, hasOccupied });
  }
  function confirmRemoveZoneAction() {
    if (!confirmDeleteZone) return;
    const { buildingId, zoneId } = confirmDeleteZone;
    const next = buildings.map((b) => b.id!==buildingId ? b : { ...b, updatedAt: new Date().toISOString(), zones: b.zones.filter((z)=>z.id!==zoneId) });
    setBuildings(next);
    sendAction({ action: "removeZone", zoneId });
    setConfirmDeleteZone(null);
    setEditZone(null);
  }

  const active = buildings ? buildings.find((b)=>b.id===activeId) : null;
  const overall = buildings ? overallCounts(buildings) : { total:0, available:0 };
  const editingZoneObj = editZone && active ? active.zones.find((z)=>z.id===editZone.zoneId) : null;

  return (
    <div className="app">
      <div className="hero">
        <div className="hero-row">
          <div>
            <div className="eyebrow disp">Nursing Home · Bed Board</div>
            <h1 className="title disp">ผังเตียงว่าง 5 สาขา</h1>
          </div>
          <div style={{display:"flex", alignItems:"center", gap:10}}>
            <div className="count-wrap">
              <div className="count-label">เตียงว่างรวม</div>
              <div className="count-value disp"><Icon.Heart size={15} />{overall.available}<span className="count-total">/{overall.total}</span></div>
            </div>
            <button className="icon-btn3d" onClick={manualRefresh}><Icon.Refresh size={15} className={saving?"spin":""} /></button>
          </div>
        </div>
      </div>

      {connError && <div className="banner banner-warn">เชื่อมต่อ Google Sheet ไม่ได้ชั่วคราว — ตรวจสอบการตั้งค่า Apps Script deployment</div>}

      <div className="strip">
        <button onClick={()=>setActiveId("__dashboard__")} className={`branch-pill dash-pill ${activeId==="__dashboard__"?"active":""}`}>
          <div className="branch-sub"><Icon.Chart size={11} />ภาพรวม</div>
          <div className="branch-name disp">แดชบอร์ด</div>
          <div className="branch-count" style={{color: activeId==="__dashboard__" ? "inherit" : "#059669"}}>{buildings ? overallCounts(buildings).available : 0} ว่างทั้งหมด</div>
        </button>
        {(buildings || []).map((b) => {
          const t = buildingCounts(b);
          const isActive = b.id === activeId;
          return (
            <button key={b.id} onClick={()=>setActiveId(b.id)} className={`branch-pill ${isActive?"active":""}`}>
              <div className="branch-sub"><Icon.Building size={11} />{b.sub}</div>
              <div className="branch-name disp">{b.name}</div>
              <div className="branch-count" style={{color: isActive ? "inherit" : (t.available>0 ? "#059669" : "#94A3B8")}}>ว่าง {t.available}/{t.total}</div>
              <div className="branch-updated" style={{opacity: isActive ? .85 : .6}}><Icon.Clock size={9} /> {formatUpdated(b.updatedAt)}</div>
            </button>
          );
        })}
      </div>

      <div className="content">
        {!buildings ? (
          <div className="loading"><Icon.Refresh size={20} className="spin" /><span>กำลังโหลดผังเตียง...</span></div>
        ) : activeId === "__dashboard__" ? (
          <Dashboard buildings={buildings} onSelectBranch={setActiveId} />
        ) : (
          <>
            {active && (
              <div className="updated-banner">
                <Icon.Clock size={13} color="#94A3B8" />
                <span><strong>{active.name}</strong> อัปเดตล่าสุด: {formatUpdatedFull(active.updatedAt)}</span>
              </div>
            )}
            {!active ? (
              <div className="loading"><Icon.Refresh size={20} className="spin" /><span>กำลังโหลดผังเตียง...</span></div>
            ) : (
              <div className="zone-grid">
                {active.zones.map((zone) => (
                  <ZoneCard key={zone.id} zone={zone}
                    onToggleBed={(bedId)=>toggleBed(active.id, zone.id, bedId)}
                    onNameChange={(bedId,v)=>changeBedName(active.id, zone.id, bedId, v)}
                    onNameBlur={()=>flushWriteName(active.id, zone.id)}
                    onToggleTag={(bedId,tagId)=>toggleCaseTag(active.id, zone.id, bedId, tagId)}
                    onStayTypeChange={(bedId,v)=>changeStayType(active.id, zone.id, bedId, v)}
                    onEdit={()=>setEditZone({buildingId:active.id, zoneId:zone.id})}
                    expandedBeds={expandedBeds} onToggleExpand={toggleExpand} />
                ))}
                <button className="add-zone-card" onClick={()=>setAddZoneFor(active.id)}>
                  <Icon.Plus size={20} />
                  <span>เพิ่มโซนใหม่</span>
                </button>
              </div>
            )}
          </>
        )}

        {editZone && editingZoneObj && (
          <div className="drawer">
            <div className="drawer-head">
              <span className="drawer-eyebrow">แก้ไขโซน</span>
              <button className="close-btn" onClick={()=>setEditZone(null)}><Icon.X size={18} /></button>
            </div>
            <label>ชื่อโซน
              <input value={editingZoneObj.name} onChange={(e)=>renameZone(editZone.buildingId, editZone.zoneId, {name:e.target.value})} />
            </label>
            <label>ประเภท
              <select value={editingZoneObj.tag} onChange={(e)=>renameZone(editZone.buildingId, editZone.zoneId, {tag:e.target.value})}>
                <option value="common">โซนรวม</option>
                <option value="vip">VIP</option>
                <option value="daycare">Day-care</option>
              </select>
            </label>
            <div style={{fontSize:12, color:"#64748B"}}>จำนวนเตียงในโซนนี้: {editingZoneObj.beds.length}</div>
            <div className="row">
              <button className="btn-outline" onClick={()=>requestRemoveBed(editZone.buildingId, editZone.zoneId)}><Icon.Minus size={14} /> ลดเตียง</button>
              <button className="btn-emerald" onClick={()=>addBed(editZone.buildingId, editZone.zoneId)}><Icon.Plus size={14} /> เพิ่มเตียง</button>
            </div>
            <p className="drawer-note">เตียงใหม่จะเรียงหมายเลขต่อท้ายอัตโนมัติ ส่วนสถานะว่าง/ไม่ว่างของแต่ละเตียงสลับได้จากปุ่มสวิตช์บนการ์ดโดยตรง</p>
            <button className="btn-danger" onClick={()=>requestRemoveZone(editZone.buildingId, editZone.zoneId)}><Icon.X size={14} /> ลบโซนนี้ทั้งหมด</button>
          </div>
        )}

        {addZoneFor && (
          <AddZoneDrawer buildingId={addZoneFor} onClose={()=>setAddZoneFor(null)} onCreate={(form)=>createZone(addZoneFor, form)} />
        )}

        {confirmDeleteZone && (
          <div className="modal-overlay" onClick={()=>setConfirmDeleteZone(null)}>
            <div className="modal-box" onClick={(e)=>e.stopPropagation()}>
              <Icon.Alert size={26} color={confirmDeleteZone.hasOccupied ? "#DC2626" : "#D97706"} />
              <div className="modal-title">ลบโซน "{confirmDeleteZone.zoneName}"?</div>
              <p className="modal-text">
                โซนนี้มี {confirmDeleteZone.bedCount} เตียง{confirmDeleteZone.hasOccupied ? " และบางเตียงยังไม่ว่าง (มีคนไข้อยู่)" : ""} —
                ลบแล้วเตียงและข้อมูลทั้งหมดในโซนนี้จะหายไปถาวร ย้อนกลับไม่ได้
              </p>
              <div className="row" style={{marginTop:4}}>
                <button className="btn-outline" onClick={()=>setConfirmDeleteZone(null)}>ยกเลิก</button>
                <button className="btn-danger" onClick={confirmRemoveZoneAction}>ยืนยันลบโซน</button>
              </div>
            </div>
          </div>
        )}

        {pendingCheckIn && (
          <div className="modal-overlay" onClick={()=>setPendingCheckIn(null)}>
            <div className="modal-box" onClick={(e)=>e.stopPropagation()}>
              <Icon.Bed size={24} color="#3CB878" />
              <div className="modal-title">เตียง {pendingCheckIn.bedLabel} — ประเภทการเข้าพัก?</div>
              <p className="modal-text">เลือกก่อนเปิดเตียงเป็นไม่ว่างทุกครั้ง เพื่อใช้สรุปยอดวางบิลและ Occupancy Rate ให้ถูกต้อง</p>
              <div className="row" style={{marginTop:4}}>
                <button className="btn-outline" onClick={()=>confirmCheckIn("daytrip")}>เช้าเย็นกลับ</button>
                <button className="btn-emerald" onClick={()=>confirmCheckIn("overnight")}>ค้างคืน</button>
              </div>
            </div>
          </div>
        )}

        {confirmDelete && (
          <div className="modal-overlay" onClick={()=>setConfirmDelete(null)}>
            <div className="modal-box" onClick={(e)=>e.stopPropagation()}>
              <Icon.Alert size={26} color={confirmDelete.bed.available ? "#D97706" : "#DC2626"} />
              <div className="modal-title">ลบเตียง {confirmDelete.bed.label}?</div>
              {!confirmDelete.bed.available ? (
                <p className="modal-text">เตียงนี้ยังไม่ว่าง{confirmDelete.bed.patient ? ` (คนไข้: ${confirmDelete.bed.patient})` : ""} — ข้อมูลผู้ป่วยและแท็กเคสของเตียงนี้จะหายไปด้วยถ้าลบ</p>
              ) : (
                <p className="modal-text">การลบไม่สามารถย้อนกลับได้</p>
              )}
              <div className="row" style={{marginTop:4}}>
                <button className="btn-outline" onClick={()=>setConfirmDelete(null)}>ยกเลิก</button>
                <button className="btn-danger" onClick={confirmRemoveBed}>ยืนยันลบ</button>
              </div>
            </div>
          </div>
        )}
      </div>

      <div className="appfoot">
        {lastSync ? `ซิงก์ล่าสุด ${lastSync.toLocaleTimeString("th-TH")} · ` : ""}
        {connected ? `เชื่อมต่อ Google Sheet ทุกสาขา (อัปเดตทุก ${POLL_MS/1000} วินาที)` : "โหมดพรีวิว (ไม่บันทึกถาวร)"}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
